<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重置密码 · Brand Center</title>
<link rel="stylesheet" href="/assets/workspace.css">
<style>
body{background:#fff}main{max-width:460px;padding:64px 24px}h1{font-size:26px;margin:24px 0}form{display:grid;gap:20px}#resetMessage{min-height:48px;margin:16px 0;overflow-wrap:anywhere}.code-row{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:end}.check{font-size:14px}.back{display:block;margin-top:24px}button{letter-spacing:0}input{background:#f7f9f8}@media(max-width:420px){main{padding:32px 20px}.code-row{grid-template-columns:minmax(0,1fr) 120px}}
</style>
<script src="/assets/password-reset.js" defer></script>
</head>
<body><main>
<a href="/login.html">Brand Center</a><h1>重置密码</h1>
<div id="resetMessage" role="status" aria-live="polite"></div>
<form id="resetForm">
<label>注册邮箱<input id="resetEmail" type="email" autocomplete="email" required maxlength="254"></label>
<div class="code-row"><label>邮箱验证码<input id="resetCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button type="button" id="sendCode" disabled>获取验证码</button></div>
<label>新密码<input id="resetPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
<label>确认新密码<input id="resetConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
<label class="check"><input type="checkbox" id="showPassword">显示密码</label>
<button class="primary" id="resetSubmit" disabled>重置密码</button>
</form>
<a class="back" href="/login.html">返回登录</a>
</main></body></html>
