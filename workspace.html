<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容工作台 · Brand Center</title>
<link rel="stylesheet" href="/assets/workspace.css">
<link rel="stylesheet" href="/assets/creation-shell.css">
<script src="/assets/workspace-entry.js" defer></script>
</head>
<body>
<header><a href="/workspace.html">Brand Center</a><nav><a href="/workspace.html" aria-current="page">创作中心</a><a href="/brand.html" data-module="brands">品牌资料</a><a href="/collection.html" data-module="collection">素材采集</a><a href="/baowenku.html" data-module="viral">爆文素材</a><a href="/xhs-writing.html" data-module="methods">写作方法</a><a href="/wencai.html" data-module="content">内容库</a><a href="/xiaohongshu-poster.html" data-module="posters">图片海报</a><a href="/xhs-insights.html" data-module="insights">热点与飞书</a><a href="/fenxi.html" data-module="analysis">文案分析</a><a href="/index.html" data-module="quick">快速生成与改写</a><a href="/fangxie.html" data-module="imitation">参考仿写</a><a href="/admin.html" data-module="users" id="usersNav" hidden>用户管理</a></nav><button id="logout">退出</button></header>
<main>
<div class="heading"><h1 id="workspaceTitle">内容工作台</h1><span id="version"></span></div>
<div class="tabs" id="workspaceTabs" role="tablist"><button data-view="jobs" aria-selected="true">创作任务</button><button data-view="quality">相似度检查</button><button data-view="feedback">方法反馈</button><button data-view="system" id="systemTab" hidden>运行状态</button></div>
<div id="notice" role="status" aria-live="polite"></div>
<section id="view-jobs" class="view">
<form id="jobForm" class="form-grid">
<fieldset class="wide"><legend>创作方向</legend><div id="creationModes" class="mode-options"><label><input type="radio" name="creationMode" value="external" checked>他牌爆文借鉴</label><label><input type="radio" name="creationMode" value="aspiration">用户向往式创作</label><label><input type="radio" name="creationMode" value="brand">品牌优质内容复创</label></div></fieldset>
<label>品牌<select id="brand"><option value="">未指定品牌</option></select></label>
<label>主题<input id="topic" required maxlength="2000"></label>
<label>内容目标<select id="goal"><option>种草转化</option><option>品牌认知</option><option>干货收藏</option><option>测评对比</option><option>复购提醒</option></select></label>
<label>人群<input id="audience" maxlength="1000"></label>
<label>生成篇数<select id="count"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
<label>差异化强度<select id="diversity"><option>明显</option><option>稳定</option><option>探索</option></select></label>
<label class="wide">事实、卖点及禁用表达<textarea id="must" rows="3" maxlength="4000"></textarea></label>
<div id="aspirationFields" class="wide form-grid" hidden><label>用户当下处境<textarea id="currentState" maxlength="2000"></textarea></label><label>向往的身份与生活状态<textarea id="desiredState" maxlength="2000"></textarea></label><label>不同视角与感受<textarea id="perspectives" maxlength="2000"></textarea></label></div>
<div id="sampleFields" class="wide"><label id="savedSampleLabel" hidden>品牌内容样本<select id="savedSample"><option value="">选择已有内容</option></select></label><label>参考文案<textarea id="creationReference" rows="6" maxlength="6000"></textarea></label><label>样本名称<input id="sampleTitle" maxlength="200"></label><label>样本表现与选择原因<textarea id="sampleContext" rows="2" maxlength="2000"></textarea></label></div>
<fieldset class="wide"><legend>写作方法</legend><div id="methods" class="methods"></div></fieldset>
<div class="wide actions"><button class="primary" type="submit">创建生成任务</button><button type="button" id="refresh">刷新任务</button></div>
</form>
<div class="job-layout"><aside><h2>任务记录</h2><div id="jobList"></div></aside><section id="jobDetail"><p class="muted">暂无任务</p></section></div>
</section>
<section id="view-quality" class="view" hidden>
<form id="qualityForm" class="quality-form"><label>品牌<select id="qualityBrand"></select></label><label>待检查文案<textarea id="qualityText" rows="12" required></textarea></label><label>参考文案<textarea id="reference" rows="5"></textarea></label><button class="primary">检查</button></form><div id="qualityResult"></div>
</section>
<section id="view-feedback" class="view" hidden><div class="table-scroll"><table><thead><tr><th>写作方法</th><th>类型</th><th>产出</th><th>采用</th><th>已发布</th><th>点赞</th><th>评论</th><th>收藏</th><th>反馈</th></tr></thead><tbody id="feedbackRows"></tbody></table></div></section>
<section id="view-system" class="view" hidden><dl id="systemStatus"></dl><a href="https://creator.xiaohongshu.com/" target="_blank" rel="noopener">小红书创作服务平台</a></section>
<section id="view-module" class="view" hidden><div class="module-actions"><button type="button" id="moduleReload" title="重新加载当前模块">重新加载</button><a id="moduleOpen" target="_blank" rel="noopener">在新标签打开</a></div><div id="moduleHost"></div></section>
</main>
</body></html>
