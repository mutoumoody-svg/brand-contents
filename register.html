<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>注册 · Brand Center</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=DM+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814; --ink-soft: #4a4640; --ink-muted: #9a9590;
  --cream: #f7f4ef;
  --accent: #b87333;
  --border: rgba(26,24,20,0.12); --border-strong: rgba(26,24,20,0.25);
  --green: #5a9e6f; --green-bg: #f0f8f3; --green-border: #a8d5b5;
  --red: #c0392b; --red-bg: #fdf5f3; --red-border: #e8c4b8;
  --serif: 'Noto Serif SC', Georgia, serif;
  --mono: 'DM Mono', monospace;
  --display: 'Playfair Display', serif;
}
body {
  font-family: var(--serif);
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2.5rem;
  width: 100%;
  max-width: 400px;
}
.logo {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 8px;
  text-align: center;
}
h1 {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 400;
  font-style: italic;
  text-align: center;
  margin-bottom: 2rem;
  color: var(--ink);
}
.field { margin-bottom: 1.5rem; }
.field label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border-strong);
  font-family: var(--serif);
  font-size: 15px;
  color: var(--ink);
  padding: 6px 0 8px;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-bottom-color: var(--accent); }
.btn {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: white;
  border: none;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.2s;
  margin-top: 0.5rem;
}
.btn:hover { background: #3a3630; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.msg {
  border-radius: 2px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 1rem;
  display: none;
  line-height: 1.6;
}
.msg.error   { background: var(--red-bg);   border: 1px solid var(--red-border);   color: var(--red); }
.msg.success { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
.footer-link {
  text-align: center;
  margin-top: 1.25rem;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
}
.footer-link a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--border); }
.footer-link a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Brand Copywriting Studio</div>
  <h1>申请注册</h1>
  <div class="msg success" id="successMsg"></div>
  <div class="msg error"   id="errorMsg"></div>
  <div class="field">
    <label>姓名</label>
    <input type="text" id="name" placeholder="你的名字"/>
  </div>
  <div class="field">
    <label>邮箱</label>
    <input type="email" id="email" placeholder="your@email.com"/>
  </div>
  <div class="field">
    <label>密码（至少 6 位）</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>
  <button class="btn" id="regBtn" onclick="register()">提交注册申请 →</button>
  <div class="footer-link">已有账号？<a href="/login.html">去登录</a></div>
</div>

<script>
async function register() {
  const name      = document.getElementById('name').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const errEl     = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  const btn       = document.getElementById('regBtn');

  errEl.style.display     = 'none';
  successEl.style.display = 'none';

  if (!name || !email || !password) {
    errEl.textContent   = '请填写所有字段';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = '提交中...';

  try {
    const res  = await fetch('/api/auth/register', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent   = data.error || '注册失败';
      errEl.style.display = 'block';
      return;
    }

    successEl.textContent    = data.message;
    successEl.style.display  = 'block';
    btn.style.display        = 'none';

    // 第一个用户（管理员）2秒后自动跳转登录
    if (data.role === 'admin') {
      setTimeout(() => window.location.replace('/login.html'), 2000);
    }
  } catch {
    errEl.textContent   = '网络错误，请重试';
    errEl.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = '提交注册申请 →';
  }
}
</script>
</body>
</html>
