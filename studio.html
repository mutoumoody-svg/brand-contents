<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文案工坊 · Brand Center</title><link rel="stylesheet" href="/assets/workspace.css"><link rel="stylesheet" href="/assets/studio.css"><script defer src="/assets/studio.js"></script></head>
<body><header><a href="/studio.html">Brand Center · 文案工坊</a><nav aria-label="主导航"><button data-tab="batch" aria-pressed="true">批量创作</button><button data-tab="imitate" aria-pressed="false">爆文仿写</button><button data-tab="research" aria-pressed="false">爆文研究</button></nav><details class="settings"><summary>资料与设置</summary><div><a href="/workspace.html?module=brands">品牌资料</a><a href="/workspace.html?module=collection">素材采集</a><a href="/workspace.html?module=content">内容库</a><a href="/workspace.html?module=methods">方法库</a><a href="/workspace.html">完整工作台</a></div></details></header>
<main><div class="heading"><h1 id="screenTitle">批量创作</h1><span class="check-status">文字＋创意双重校验 · 高相似自动重写一次</span></div><p id="message" role="status" aria-live="polite"></p>
<div id="presetField"><label>选择创作方向<select id="directionPreset" form="createForm" required><option value="">正在加载预设方向…</option></select></label><p id="directionBrief" class="muted" aria-live="polite"></p></div>
<section id="creation"><form id="createForm"><div class="form-grid"><label>品牌<select id="brand"><option value="">未指定品牌</option></select></label><label>主题<input id="topic" required maxlength="2000"></label><label>篇数<select id="count"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label class="wide" id="directionLabel">创作方向<textarea id="direction" rows="2" maxlength="2000"></textarea></label><label class="wide" id="referenceLabel" hidden>参考爆文<textarea id="source" rows="6" maxlength="6000"></textarea></label><label class="wide">真实产品信息与要求<textarea id="facts" rows="3" maxlength="4000"></textarea></label></div><details><summary>写作方法与受众</summary><div class="form-grid"><label>写作方法<select id="method"><option value="">不指定</option></select></label><label>目标用户<input id="audience" maxlength="1000"></label><label>内容目标<select id="goal"><option>让人向往</option><option>回答顾虑</option><option>帮助选购</option><option>促进复购</option></select></label></div></details><div class="actions"><button class="primary" id="createButton">开始批量创作</button></div></form>
<div class="results-layout"><aside><h2>任务记录</h2><button id="refresh" title="刷新任务">刷新</button><div id="jobs"></div></aside><section id="results"><p class="muted">暂无创作任务</p></section></div></section>
<section id="research" hidden><form id="researchForm"><div class="section-head"><h2>爆文样本</h2><button type="button" id="addSample">添加样本</button></div><div id="samples"></div><button class="primary" id="analyze">分析共性与差异</button></form><section id="researchOutput"></section><details><summary>研究记录</summary><div id="researchHistory"></div></details></section>
<section id="writingSkills"><details><summary>结构拆解、评论洞察与品牌表达学习</summary><div class="form-grid"><label>分析类型<select id="skillKind"><option value="structure">爆文结构拆解</option><option value="comments">真实评论洞察</option><option value="expression">品牌表达学习</option></select></label><div class="actions"><button type="button" id="copyReference">使用参考爆文</button></div><label class="wide">原始素材<textarea id="skillSource" rows="6" maxlength="16000"></textarea></label></div><button type="button" id="skillAnalyze">开始分析</button><div id="skillOutput"></div><details><summary>当前品牌学习记录</summary><div id="knowledgeList"></div></details></details></section>
<script src="/assets/studio-skills.js" defer></script>
</main></body></html>
