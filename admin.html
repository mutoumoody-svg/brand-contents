<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>用户管理 · Brand Center</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=DM+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814; --ink-soft: #4a4640; --ink-muted: #9a9590;
  --cream: #f7f4ef; --cream-dark: #ede9e2;
  --accent: #2c5f8a; --accent-pale: #edf4fa;
  --border: rgba(26,24,20,0.12); --border-strong: rgba(26,24,20,0.25);
  --green: #5a9e6f; --green-bg: #f0f8f3;
  --red: #c0392b; --red-bg: #fdf5f3; --red-border: #e8c4b8;
  --gold: #b87333; --gold-pale: #f5ede0;
  --serif: 'Noto Serif SC', Georgia, serif;
  --mono: 'DM Mono', monospace;
  --display: 'Playfair Display', serif;
}
body { font-family: var(--serif); background: var(--cream); color: var(--ink); min-height: 100vh; }
.top-nav { background: var(--ink); height: 64px; display: flex; align-items: center; position: sticky; top: 0; z-index: 200; }
.top-nav-inner { max-width: 960px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
.top-nav-logo { font-family: var(--mono); font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); text-decoration: none; }
.top-nav-right { display: flex; align-items: center; gap: 4px; }
.top-nav-link { font-family: var(--mono); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.5); text-decoration: none; padding: 8px 10px; border-radius: 2px; transition: all 0.15s; background: transparent; border: none; cursor: pointer; }
.top-nav-link:hover { color: white; background: rgba(255,255,255,0.1); }
.top-nav-link.active { color: white; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 24px 4rem; }
h2 { font-family: var(--display); font-size: 22px; font-weight: 400; font-style: italic; margin-bottom: 1.5rem; }
.section-title { font-family: var(--mono); font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
.user-table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 2rem; }
.user-table th { font-family: var(--mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-muted); padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); background: var(--cream); }
.user-table td { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--ink-soft); vertical-align: middle; }
.user-table tr:last-child td { border-bottom: none; }
.user-table tr:hover td { background: var(--cream); }
.badge { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; padding: 2px 10px; border-radius: 20px; white-space: nowrap; }
.badge-pending { background: #fff8e6; color: #9a6500; }
.badge-user    { background: var(--green-bg); color: var(--green); }
.badge-admin   { background: var(--accent-pale); color: var(--accent); }
.action-btn { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 2px; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--ink-muted); transition: all 0.15s; margin-right: 4px; }
.action-btn:hover { background: var(--cream-dark); color: var(--ink); }
.action-btn.approve:hover { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.action-btn.del:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.empty { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.1em; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--cream); font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 10px 18px; border-radius: 2px; transform: translateY(60px); opacity: 0; transition: all 0.3s; z-index: 999; }
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
<script>
(function(){
  const token = localStorage.getItem('brand_auth_token');
  const role  = localStorage.getItem('brand_user_role');
  if (!token) window.location.replace('/login.html');
  if (role !== 'admin') window.location.replace('/index.html');
})();
</script>

<nav class="top-nav">
  <div class="top-nav-inner">
    <a class="top-nav-logo" href="/index.html">Brand Center</a>
    <div class="top-nav-right">
      <a class="top-nav-link" href="/brand.html">品牌管理</a>
      <a class="top-nav-link" href="/index.html">文案生成</a>
      <a class="top-nav-link" href="/xhs-writing.html">小红书文案</a>
      <a class="top-nav-link" href="/fenxi.html">文案分析</a>
      <a class="top-nav-link" href="/xiaohongshu-poster.html">图片海报</a>
      <a class="top-nav-link" href="/xhs-insights.html">热点洞察</a>
      <a class="top-nav-link active" href="/admin.html">用户管理</a>
      <span id="navUserName" style="font-family:var(--mono);font-size:14px;color:rgba(255,255,255,0.35);letter-spacing:0.05em;padding:0 8px;"></span>
      <button class="top-nav-link" onclick="logout()">退出</button>
    </div>
  </div>
</nav>

<div class="container">
  <h2>用户管理</h2>

  <div class="section-title" id="pendingTitle">待审核 · 0</div>
  <table class="user-table" id="pendingTable">
    <thead><tr>
      <th>姓名</th><th>邮箱</th><th>申请时间</th><th>操作</th>
    </tr></thead>
    <tbody id="pendingBody"><tr><td colspan="4" class="empty">暂无待审核用户</td></tr></tbody>
  </table>

  <div class="section-title" id="activeTitle">已通过用户 · 0</div>
  <table class="user-table" id="activeTable">
    <thead><tr>
      <th>姓名</th><th>邮箱</th><th>角色</th><th>注册时间</th><th>操作</th>
    </tr></thead>
    <tbody id="activeBody"><tr><td colspan="5" class="empty">暂无用户</td></tr></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
document.getElementById('navUserName').textContent = localStorage.getItem('brand_user_name') || '';

function logout() {
  ['brand_auth_token','brand_user_name','brand_user_role'].forEach(k => localStorage.removeItem(k));
  window.location.replace('/login.html');
}

function getToken() { return localStorage.getItem('brand_auth_token') || ''; }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function authFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken(), ...(opts.headers || {}) },
  });
}

async function loadUsers() {
  const res   = await authFetch('/api/admin/users');
  if (!res.ok) { if (res.status === 401) logout(); return; }
  const users = await res.json();

  const pending = users.filter(u => u.role === 'pending');
  const active  = users.filter(u => u.role !== 'pending');

  document.getElementById('pendingTitle').textContent = `待审核 · ${pending.length}`;
  document.getElementById('activeTitle').textContent  = `已通过用户 · ${active.length}`;

  // 待审核表格
  const pb = document.getElementById('pendingBody');
  if (pending.length === 0) {
    pb.innerHTML = '<tr><td colspan="4" class="empty">暂无待审核用户</td></tr>';
  } else {
    pb.innerHTML = pending.map(u => `
      <tr>
        <td>${u.name}</td>
        <td style="color:var(--ink-muted)">${u.email}</td>
        <td style="font-family:var(--mono);font-size:11px;color:var(--ink-muted)">${u.created_at.slice(0,16)}</td>
        <td>
          <button class="action-btn approve" onclick="approve(${u.id})">审核通过</button>
          <button class="action-btn del"     onclick="deleteUser(${u.id})">拒绝删除</button>
        </td>
      </tr>`).join('');
  }

  // 已通过用户表格
  const ab = document.getElementById('activeBody');
  const myId = JSON.parse(atob(getToken().split('.')[1])).id;
  if (active.length === 0) {
    ab.innerHTML = '<tr><td colspan="5" class="empty">暂无用户</td></tr>';
  } else {
    ab.innerHTML = active.map(u => `
      <tr>
        <td>${u.name}${u.id === myId ? ' <span style="font-family:var(--mono);font-size:9px;color:var(--ink-muted)">(我)</span>' : ''}</td>
        <td style="color:var(--ink-muted)">${u.email}</td>
        <td><span class="badge badge-${u.role}">${u.role === 'admin' ? '管理员' : '普通用户'}</span></td>
        <td style="font-family:var(--mono);font-size:11px;color:var(--ink-muted)">${u.created_at.slice(0,16)}</td>
        <td>
          ${u.role !== 'admin' ? `<button class="action-btn" onclick="promote(${u.id})">设为管理员</button>` : ''}
          ${u.id !== myId ? `<button class="action-btn del" onclick="deleteUser(${u.id})">删除</button>` : ''}
        </td>
      </tr>`).join('');
  }
}

async function approve(id) {
  await authFetch(`/api/admin/users/${id}/approve`, { method: 'POST' });
  showToast('✓ 已审核通过');
  loadUsers();
}

async function promote(id) {
  if (!confirm('确定将该用户设为管理员？')) return;
  await authFetch(`/api/admin/users/${id}/promote`, { method: 'POST' });
  showToast('✓ 已设为管理员');
  loadUsers();
}

async function deleteUser(id) {
  if (!confirm('确定删除该用户？')) return;
  await authFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
  showToast('已删除');
  loadUsers();
}

loadUsers();
</script>
</body>
</html>
